# Creality CFS on a K1 Max (plain Klipper). Use this file INSTEAD of cfs_macros.cfg (the Hi
# macros): [include cfs_k1max.cfg] in printer.cfg.
# Values from the stock K1 Max box.cfg and RS485 wire logs (firmware 2.3.5.34, board
# CR4CU220812S11), hardware-tested on a K1 Max.
#
# Tool change (stock K1 Max flow): z-hop -> cut (Y ram at X38 to Y306, cutter switch
# confirmed) -> lift to Z30 -> unload to the box -> rear purge chute (185, 305.5) -> load the
# new slot -> purge at the chute -> back to the print.
# No nozzle wipe: the stock wipe (X187-210 at Y305.5) is skipped because a side-mounted probe
# (e.g. Eddy at x_offset -23) hits the cleaning station there. Restore it in _CFS_LEAVE_CHUTE
# if your toolhead is stock.
#
# Printer requirements:
#   [stepper_y] position_max >= 306 (the stock K1 Max uses 307.5; the cut presses at Y306).
#   Part fan: _CFS_LEAVE_CHUTE restores printer.fan when a [fan] exists; the stock K1 M106 macro
#   (output_pin fan0) works too, chute_fan is then restored to 0.
#   Your START_PRINT / END_PRINT / CANCEL_PRINT / RESUME call the CFS_PRINT_* hooks at the end
#   of this file; slicer change-filament G-code is described there too.

# Mainline Klipper needs [respond] for the RESPOND lines below (Kalico loads it by itself).
# Repeating the section is harmless when printer.cfg already has it.
[respond]

[creality_cfs]
serial_port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0   # CH340 USB-RS485 adapter
baud: 230400
box_count: 1
auto_init: True
filament_sensor: filament_sensor_2
extrude_temp: 220
# K1 Max stock parity (all default to the Hi behaviour when left out)
load_finalize: False            # stock never sends the 0x10 [slot 07 03] finalize
release_feeder_after_load: False  # feeder engaged once per print (CFS_FEEDER), not per load
retrude_pull_len: 20            # stock Tn_retrude
heartbeat_interval: 4           # stock 0x0A poll; without it the front LEDs blink red
k1max_connect: True             # stock K1 Max connect burst; with the Hi burst spool inserts stop
idle_presence_poll: False       # stock sends no 0x08 while idle; inserts follow the 0x30 pushes
loader_wake: True               # cold boot: the box answers from its loader, wake and re-address
detect_path_on_connect: True    # recover the loaded slot after a restart (0x08 ch 1)
buffer_recheck_s: 7             # a non-middle buffer right after a load settles during the purge
box_sensor: cfs_box             # box temperature + humidity as temperature_sensor cfs_box
# Fluidd AFC panel: slots as lanes with material/colour/tool map/runout slot.
# T0-T3 and CFS_MENU below read printer.AFC, so keep it on with these macros.
afc_compat: True
lane_data_file: /usr/data/printer_data/config/cfs/cfs_lanes.json
# Cutter: stock box.cfg pre_cut 38/230, cut_pos_y 306, cut_velocity 7000. Do NOT set
# cut_pos_x (stock lists 38 = pre_cut_x; the module would see a zero-travel X ram).
# The switch closes at Y~305.
cut_switch_pin: nozzle_mcu:PA8
cut_switch_button: cfs_cut_switch
pre_cut_pos_x: 38
pre_cut_pos_y: 230
cut_pos_y: 306
cut_velocity: 7000
# Purge at the chute. CFS_TOOL always passes LEN=, so the volume formula is unused.
buffer_empty_len: 10
flush_default_len: 140
flush_velocity: 360

# Toolhead filament switch (the CFS kit sensor on the nozzle board). Note the stock K1 preset
# of older module versions swapped it with the cutter switch: PA10 is the filament, PA8 the cutter.
[filament_switch_sensor filament_sensor_2]
pause_on_runout: False
switch_pin: ^!nozzle_mcu:PA10
runout_gcode: CFS_ON_RUNOUT

# The stock rear sensor (filament_sensor, !PC15) is not in the CFS path and always reads
# "detected": keep it from ever pausing, if it is configured.
[delayed_gcode _CFS_STARTUP]
initial_duration: 2
gcode:
  {% if "filament_switch_sensor filament_sensor" in printer %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% endif %}

# Cutter switch: rest = RELEASED, lever pushed = PRESSED. Read by CFS_CUT.
[gcode_button cfs_cut_switch]
pin: nozzle_mcu:PA8
press_gcode:
  RESPOND MSG="CFS cut switch: pressed"
release_gcode:
  RESPOND MSG="CFS cut switch: released"

# ---------------------------------------------------------------------------
# Settings and slicer hand-off
# ---------------------------------------------------------------------------
[gcode_macro _CFS_SETTINGS]
description: CFS tool change settings (K1 Max)
variable_purge_x: 185.0          # stock extrude_pos: rear purge chute
variable_purge_y: 305.5
variable_safe_y: 291.5           # stock safe_pos_y: approach/leave the chute along Y from here
variable_safe_z: 30.0            # stock extrude_pos_z: minimum Z while at the rear
variable_zhop: 0.8               # stock z-hop before the cut
variable_first_load_len: 140.0   # stock Tn_extrude: purge when the toolhead was empty
variable_change_purge_len: 30.0  # purge on a colour change when the slicer passes none
variable_purge_velocity: 360.0   # stock Tn_extrude_velocity
variable_chute_ticks: 2          # press/release cycles of the chute lever after a purge (drops the blob)
variable_chute_cool_s: 10        # wait outside the chute after the first release so the purge cools and drops
variable_chute_fan: 1.0          # part fan (0-1) during that wait, cools the purge and the nozzle tip
variable_chute_retract: 2.0      # mm retracted during the wait (less ooze on the nozzle); restored at the print
variable_chute_retracted: 0.0    # set by _CFS_LEAVE_CHUTE, consumed by _CFS_UNRETRACT
variable_aux_fan: ""             # fan_generic name of a side/auxiliary fan to stop during a colour change ("" = none)
variable_aux_fan_saved: 0.0      # its speed before the change, restored after it
# Set by the slicer's change_filament_gcode before each T<n>; reset after use.
variable_next_purge: -1.0
variable_next_temp: 0
# Temperature of the filament now in the toolhead (unload heats to at least this).
variable_loaded_temp: 0
gcode:
  RESPOND MSG="CFS: purge ({purge_x}, {purge_y}) safe_y {safe_y} safe_z {safe_z}"

# ---------------------------------------------------------------------------
# Tool change
# ---------------------------------------------------------------------------
[gcode_macro CFS_TOOL]
description: Load CFS slot TOOL=0-3 (cuts and unloads the current one first). [TEMP=] [PURGE=mm]
gcode:
  # If the loaded slot is unknown (Klipper restarted), ask the box first; _CFS_TOOL_RUN
  # renders afterwards, so it sees the detected slot.
  {% if printer.creality_cfs.active_tool|int < 0 %}
    CFS_DETECT
  {% endif %}
  _CFS_TOOL_RUN {rawparams}

[gcode_macro _CFS_TOOL_RUN]
gcode:
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% set cfs = printer.creality_cfs %}
  {% set tool = params.TOOL|int %}
  {% set loaded = printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
  {% set active = cfs.active_tool|int %}
  {% if tool < 0 or tool > 3 %}
    {action_raise_error("CFS_TOOL: TOOL must be 0-3")}
  {% endif %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("CFS_TOOL: home the printer first (G28)")}
  {% endif %}
  {% if loaded and active == tool %}
    RESPOND MSG="CFS: slot{tool + 1} already loaded"
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=next_purge VALUE=-1
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=next_temp VALUE=0
  {% elif loaded and active < 0 %}
    {action_raise_error("CFS_TOOL: filament is in the toolhead but neither Klipper nor the box knows its slot. Run CFS_UNLOAD TOOL=<slot it came from> first.")}
  {% else %}
    {% set target = printer.extruder.target|float %}
    {% if params.TEMP is defined %}
      {% set temp = params.TEMP|float %}
    {% elif v.next_temp|float >= 170 %}
      {% set temp = v.next_temp|float %}
    {% elif target >= 170 %}
      {% set temp = target %}
    {% else %}
      {% set temp = printer.configfile.settings.creality_cfs.extrude_temp|float %}
    {% endif %}
    {% set unload_temp = [temp, v.loaded_temp|float]|max %}
    {% if params.PURGE is defined %}
      {% set purge = params.PURGE|float %}
    {% elif v.next_purge|float >= 0 %}
      # an empty toolhead needs the full first-load purge (Orca sends next_purge=0 before the first T)
      {% set purge = v.next_purge|float if loaded else [v.next_purge|float, v.first_load_len|float]|max %}
    {% elif loaded %}
      {% set purge = v.change_purge_len|float %}
    {% else %}
      {% set purge = v.first_load_len|float %}
    {% endif %}
    RESPOND MSG="CFS: slot{active + 1 if active >= 0 else '-'} -> slot{tool + 1} at {temp|int}C, purge {purge|round(1)} mm"
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=0
    SAVE_GCODE_STATE NAME=_cfs_tc
    _CFS_AUX_FAN_PAUSE
    G90
    _CFS_ZHOP
    {% if loaded %}
      CFS_CUT TEMP={unload_temp}
      _CFS_LIFT_Z
      CFS_RETRUDE TOOL={active} TEMP={unload_temp}
    {% else %}
      _CFS_LIFT_Z
      {% if active >= 0 and active != tool %}
        # Another slot's filament is stuck in the path short of the toolhead: return it first.
        RESPOND MSG="CFS: slot{active + 1} is in the path, returning it before loading slot{tool + 1}"
        CFS_RETRUDE TOOL={active} TEMP={unload_temp}
      {% endif %}
    {% endif %}
    _CFS_GO_CHUTE
    CFS_EXTRUDE TOOL={tool} TEMP={temp}
    {% if purge > 0 %}
      CFS_FLUSH LEN={purge} TEMP={temp} VELOCITY={v.purge_velocity}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=loaded_temp VALUE={temp|int}
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=next_purge VALUE=-1
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=next_temp VALUE=0
    _CFS_LEAVE_CHUTE
    RESTORE_GCODE_STATE NAME=_cfs_tc MOVE=1 MOVE_SPEED=150
    _CFS_UNRETRACT
    _CFS_AUX_FAN_RESTORE
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1
  {% endif %}

[gcode_macro CFS_UNLOAD]
description: Cut and return the filament to the CFS (also clears a slot stuck in the path). [TOOL=0-3] [TEMP=]
gcode:
  {% if params.TOOL is not defined and printer.creality_cfs.active_tool|int < 0 %}
    CFS_DETECT
  {% endif %}
  _CFS_UNLOAD_RUN {rawparams}

[gcode_macro _CFS_UNLOAD_RUN]
gcode:
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% set loaded = printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
  {% set active = params.TOOL|default(printer.creality_cfs.active_tool)|int %}
  {% set temp = params.TEMP|default([v.loaded_temp|float, printer.extruder.target|float, printer.configfile.settings.creality_cfs.extrude_temp|float]|max)|float %}
  {% if not loaded and active < 0 %}
    RESPOND MSG="CFS: toolhead and path are empty, nothing to unload"
  {% elif active < 0 %}
    {action_raise_error("CFS_UNLOAD: filament is in the toolhead but its slot is unknown, pass TOOL=0-3")}
  {% elif not loaded %}
    # Filament in the path but not at the toolhead: no cut, no toolhead move needed.
    RESPOND MSG="CFS: returning slot{active + 1} from the path"
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=0
    CFS_RETRUDE TOOL={active} TEMP={temp}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=loaded_temp VALUE=0
  {% elif "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("CFS_UNLOAD: home the printer first (G28)")}
  {% else %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=0
    SAVE_GCODE_STATE NAME=_cfs_unload
    G90
    _CFS_ZHOP
    CFS_CUT TEMP={temp}
    _CFS_LIFT_Z
    CFS_RETRUDE TOOL={active} TEMP={temp}
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=loaded_temp VALUE=0
    RESTORE_GCODE_STATE NAME=_cfs_unload
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1
  {% endif %}

[gcode_macro CFS_CUT_FILAMENT]
description: Cut the filament at the toolhead and return (no unload). [TEMP=]
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("CFS_CUT_FILAMENT: home the printer first (G28)")}
  {% endif %}
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% set temp = params.TEMP|default([v.loaded_temp|float, printer.extruder.target|float, printer.configfile.settings.creality_cfs.extrude_temp|float]|max)|float %}
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=0
  SAVE_GCODE_STATE NAME=_cfs_cut
  G90
  _CFS_ZHOP
  CFS_CUT TEMP={temp}
  RESTORE_GCODE_STATE NAME=_cfs_cut MOVE=1 MOVE_SPEED=150
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1

[gcode_macro CFS_CHUTE_TEST]
description: Run the chute part of a colour change without changing filament. [PURGE=mm (needs filament loaded)] [TEMP=]
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("CFS_CHUTE_TEST: home the printer first (G28)")}
  {% endif %}
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% set purge = params.PURGE|default(0)|float %}
  {% set temp = params.TEMP|default([v.loaded_temp|float, printer.extruder.target|float, printer.configfile.settings.creality_cfs.extrude_temp|float]|max)|float %}
  {% if purge > 0 and not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    {action_raise_error("CFS_CHUTE_TEST: PURGE needs filament in the toolhead (load a slot first)")}
  {% endif %}
  RESPOND MSG="CFS: chute test, purge {purge|round(1)} mm"
  SAVE_GCODE_STATE NAME=_cfs_chute
  G90
  _CFS_ZHOP
  _CFS_LIFT_Z
  _CFS_GO_CHUTE
  {% if purge > 0 %}
    CFS_FLUSH LEN={purge} TEMP={temp} VELOCITY={v.purge_velocity}
  {% endif %}
  _CFS_LEAVE_CHUTE
  RESTORE_GCODE_STATE NAME=_cfs_chute MOVE=1 MOVE_SPEED=150
  _CFS_UNRETRACT

# ---------------------------------------------------------------------------
# Menu as a Klipper action:prompt dialog (Mainsail, Fluidd and screens that render prompts,
# e.g. GrumpyScreen: point its load-filament button at CFS_MENU TEMP={}).
# ---------------------------------------------------------------------------
[gcode_macro CFS_MENU]
description: CFS menu as a dialog: box climate, slots, load/unload buttons. [TEMP=load temp]
gcode:
  {% set cfs = printer.creality_cfs %}
  {% set env = cfs.box_env.box1|default({}) %}
  {% set temp = params.TEMP|default(0)|int %}
  {% set temp_arg = (" TEMP=%d" % temp) if temp >= 170 else "" %}
  {% set active = cfs.active_tool|int %}
  RESPOND TYPE=command MSG="action:prompt_begin CFS"
  {% if env %}
    RESPOND TYPE=command MSG="action:prompt_text Box: {env.temperature|int} C, humidity {env.humidity|int} %"
  {% endif %}
  {% for i in range(4) %}
    {% set lane = printer["AFC_lane slot%d" % (i + 1)] %}
    {% set present = cfs.slots[i|string].present if (i|string) in cfs.slots else False %}
    {% set state = "in toolhead" if i == active else ("ready" if present else "empty") %}
    RESPOND TYPE=command MSG="action:prompt_text Slot{i + 1} ({lane.map}): {lane.material or '?'} {lane.color or ''} - {state}"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for i in range(4) %}
    {% set present = cfs.slots[i|string].present if (i|string) in cfs.slots else False %}
    {% if present and i != active %}
      RESPOND TYPE=command MSG="action:prompt_button Load {i + 1}|_CFS_MENU_RUN CMD=CFS_TOOL TOOL={i}{temp_arg}|primary"
    {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% if active >= 0 %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Unload|_CFS_MENU_RUN CMD=CFS_UNLOAD|warning"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CFS_MENU_RUN]
description: Close the CFS menu, home if needed and run a CFS command. CMD= [TOOL=] [TEMP=]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if printer.print_stats.state == "printing" %}
    {action_raise_error("CFS menu: not while printing (pause first)")}
  {% endif %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set args = "" %}
  {% if params.TOOL is defined %}{% set args = args ~ " TOOL=" ~ params.TOOL %}{% endif %}
  {% if params.TEMP is defined %}{% set args = args ~ " TEMP=" ~ params.TEMP %}{% endif %}
  {params.CMD}{args}

# Slicer tools follow the slot mapping set in Fluidd (SET_MAP); default Tn -> slot n+1.
[gcode_macro T0]
gcode: CFS_TOOL TOOL={printer.AFC.tool_map.T0} {rawparams}
[gcode_macro T1]
gcode: CFS_TOOL TOOL={printer.AFC.tool_map.T1} {rawparams}
[gcode_macro T2]
gcode: CFS_TOOL TOOL={printer.AFC.tool_map.T2} {rawparams}
[gcode_macro T3]
gcode: CFS_TOOL TOOL={printer.AFC.tool_map.T3} {rawparams}

# ---------------------------------------------------------------------------
# Motion helpers (each runs as its own macro so it reads the live position)
# ---------------------------------------------------------------------------
[gcode_macro _CFS_ZHOP]
gcode:
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% set z = printer.toolhead.position.z + v.zhop|float %}
  {% if z <= printer.toolhead.axis_maximum.z %}
    G90
    G1 Z{z} F600
  {% endif %}

[gcode_macro _CFS_LIFT_Z]
gcode:
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% if printer.toolhead.position.z < v.safe_z|float %}
    G90
    G1 Z{v.safe_z} F600
  {% endif %}

[gcode_macro _CFS_GO_CHUTE]
gcode:
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  G90
  G1 X{v.purge_x} Y{v.safe_y} F9000
  G1 Y{v.purge_y} F3000
  M400

[gcode_macro _CFS_LEAVE_CHUTE]
gcode:
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% set fan = printer.fan.speed|float if "fan" in printer else 0 %}
  {% set retract = v.chute_retract|float if printer.extruder.can_extrude
                   and printer["filament_switch_sensor filament_sensor_2"].filament_detected else 0 %}
  G90
  G1 Y{v.safe_y} F3000
  {% if v.chute_fan|float > 0 %}
    M106 S{(v.chute_fan|float * 255)|int}
  {% endif %}
  {% if retract > 0 %}
    M83
    G1 E-{retract} F1800
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=chute_retracted VALUE={retract}
  {% endif %}
  {% if v.chute_ticks|int > 1 and v.chute_cool_s|float > 0 %}
    G4 P{(v.chute_cool_s|float * 1000)|int}
  {% endif %}
  {% for i in range(v.chute_ticks|int - 1) %}
    G1 Y{v.purge_y} F3000
    G1 Y{v.safe_y} F3000
  {% endfor %}
  {% if v.chute_fan|float > 0 %}
    M106 S{(fan * 255)|int}
  {% endif %}

# Call at the start of your PAUSE/CANCEL park macros: if a failed load left the toolhead at the
# chute (behind the bed), go straight forward to safe_y first, so a diagonal park move does not
# sweep the back edge (with a side-mounted probe it hits the cleaning station).
[gcode_macro _CFS_CHUTE_ESCAPE]
gcode:
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% if "xy" in printer.toolhead.homed_axes and printer.toolhead.position.y > v.purge_y|float - 3 %}
    RESPOND MSG="CFS: toolhead at the chute, moving to Y{v.safe_y} before parking"
    SAVE_GCODE_STATE NAME=_cfs_escape
    G90
    G1 Y{v.safe_y} F3000
    RESTORE_GCODE_STATE NAME=_cfs_escape
  {% endif %}

# Side fan off for the colour change (slicers often run it for the whole print). M400 first so
# the speed read is the one the slicer set right before T<n>, not a stale status.
[gcode_macro _CFS_AUX_FAN_PAUSE]
gcode:
  M400
  _CFS_AUX_FAN_PAUSE_RUN

[gcode_macro _CFS_AUX_FAN_PAUSE_RUN]
gcode:
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% set name = v.aux_fan|string %}
  {% set fan = printer["fan_generic " ~ name] if name and ("fan_generic " ~ name) in printer else none %}
  {% if fan and fan.speed > 0 %}
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=aux_fan_saved VALUE={fan.speed}
    SET_FAN_SPEED FAN={name} SPEED=0
  {% endif %}

[gcode_macro _CFS_AUX_FAN_RESTORE]
gcode:
  {% set v = printer["gcode_macro _CFS_SETTINGS"] %}
  {% if v.aux_fan_saved|float > 0 %}
    SET_FAN_SPEED FAN={v.aux_fan} SPEED={v.aux_fan_saved}
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=aux_fan_saved VALUE=0
  {% endif %}

# Puts back the filament retracted at the chute, once the toolhead is back at the print.
[gcode_macro _CFS_UNRETRACT]
gcode:
  {% set r = printer["gcode_macro _CFS_SETTINGS"].chute_retracted|float %}
  {% if r > 0 %}
    SAVE_GCODE_STATE NAME=_cfs_unretract
    M83
    G1 E{r} F1800
    RESTORE_GCODE_STATE NAME=_cfs_unretract
    SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=chute_retracted VALUE=0
  {% endif %}

# ---------------------------------------------------------------------------
# Print hooks: call these from your own print macros (names as in cfs_macros.cfg).
#
#   START_PRINT, after homing, heating and the bed mesh, before the purge line:
#       CFS_PRINT_START INITIAL_TOOL={params.INITIAL_TOOL} TEMP={params.EXTRUDER_TEMP}
#     with the slicer start G-code passing INITIAL_TOOL=[initial_tool] (Orca/Prusa).
#   Before an adaptive BED_MESH_CALIBRATE: CFS_TOWER_AREA (adds the prime tower to the mesh).
#   END_PRINT, before turning the heaters off:   CFS_PRINT_END
#   CANCEL_PRINT, before CANCEL_PRINT_BASE:      CFS_PRINT_CANCEL
#   RESUME, before RESUME_BASE:                  CFS_RESUME_CHECK
#   Park macros (PAUSE/CANCEL), first line:     _CFS_CHUTE_ESCAPE
#
# Slicer change-filament G-code (before each T<n>), Orca example:
#   SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=next_temp VALUE=[new_filament_temp]
#   SET_GCODE_VARIABLE MACRO=_CFS_SETTINGS VARIABLE=next_purge VALUE={flush_length}
# ---------------------------------------------------------------------------
[gcode_macro CFS_PRINT_START]
description: CFS print start: map slicer tools to slots, engage the feeder, load INITIAL_TOOL. [INITIAL_TOOL=] [TEMP=]
gcode:
  CFS_AUTO_MAP
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1
  CFS_FEEDER ENABLE=1
  {% if params.INITIAL_TOOL is defined and params.INITIAL_TOOL|string != "" %}
    CFS_TOOL TOOL={printer.AFC.tool_map["T%d" % (params.INITIAL_TOOL|int)]} TEMP={params.TEMP|default(printer.extruder.target)|float}
  {% elif not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    RESPOND TYPE=error MSG="CFS: no INITIAL_TOOL and the toolhead is empty; the purge line will be dry"
  {% endif %}

# End and cancel: a failed unload (jam, tangled spool) is reported but must not stop the
# calling macro. CANCEL_PRINT runs this before CANCEL_PRINT_BASE: an error here would abort the
# cancel and the file would keep printing.
[gcode_macro CFS_PRINT_END]
description: CFS print end: cut and return the filament to the box, release the feeder
gcode:
  CFS_TRY CMD=CFS_UNLOAD
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1
  CFS_TRY CMD=_CFS_FEEDER_OFF

[gcode_macro CFS_PRINT_CANCEL]
description: CFS print cancel: like CFS_PRINT_END, then the hotend off (the unload reheats it)
gcode:
  CFS_PRINT_END
  M104 S0

[gcode_macro _CFS_FEEDER_OFF]
gcode:
  CFS_FEEDER ENABLE=0

# Runout on the toolhead sensor. A slot that ran out leaves the path empty, so CFS_DETECT clears
# the loaded slot; CFS_AUTO_REFILL continues with the slot's runout slot (or one with the same
# material and colour) and resumes. With no match the print stays paused for CFS_TOOL + RESUME.
# FROM is rendered before CFS_DETECT runs.
[gcode_macro CFS_ON_RUNOUT]
description: Toolhead filament runout: pause, then auto-refill from another slot if one matches
gcode:
  {% if printer.print_stats.state == "printing" %}
    PAUSE
    _CFS_ON_RUNOUT_RUN
  {% endif %}

[gcode_macro _CFS_ON_RUNOUT_RUN]
gcode:
  CFS_DETECT
  CFS_AUTO_REFILL FROM={printer.creality_cfs.active_tool}

[gcode_macro CFS_RESUME_CHECK]
description: Refuse to resume with an empty toolhead
gcode:
  {% if not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    {action_raise_error("CFS: no filament in the toolhead. Load a slot with CFS_TOOL TOOL=<0-3>, then RESUME.")}
  {% endif %}
