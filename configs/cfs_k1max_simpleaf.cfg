# Creality CFS on a K1 Max with SimpleAF (Pellcorp's Kalico-based K1 firmware) + EddyNG.
# Overlay on cfs_k1max.cfg: include it right AFTER that file. Klipper merges a repeated
# section option by option and the later value wins, so this file only adds or overrides the
# SimpleAF pieces. In /usr/data/printer_data/config/printer.cfg, replace [include cfs.cfg] with
#   [include cfs_k1max.cfg]
#   [include cfs_k1max_simpleaf.cfg]
# below the SimpleAF includes (fan_control.cfg and client.cfg must come first: this file
# replaces their M141/M191 and _CLIENT_VARIABLE runout_sensor).
# Needs the extras creality_cfs.py and abortable_waits.py in config/cfs/, linked into
# klippy/extras by S54cfs_module. Slicer G-code: SLICER_GCODE_K1MAX.md.

[creality_cfs]
# A load/purge error at the chute leaves the toolhead pressing the lever; CANCEL_PRINT/PAUSE then
# park diagonally from there across the cleaning station (the Eddy hits it). The guard runs
# _CFS_CHUTE_ESCAPE before SimpleAF's park macros so the toolhead leaves along Y first.
park_guard: _TOOLHEAD_PARK_PAUSE_CANCEL, _TOOLHEAD_PARK_END_PRINT
park_guard_gcode: _CFS_CHUTE_ESCAPE

# SimpleAF's handler: PAUSE only while printing, then _SAF_ON_FILAMENT_RUNOUT. The CFS macros
# disable this sensor while they cut/unload/load so a colour change never reads as a runout.
[filament_switch_sensor filament_sensor_2]
runout_gcode: _ON_FILAMENT_RUNOUT

# SimpleAF checks its runout sensor before START_PRINT and RESUME. The stock rear sensor is out
# of the CFS path (always reads "detected") and the toolhead is empty at the start of a CFS
# print, so SimpleAF's check is turned off; _SAF_ON_RESUME below does the CFS check instead.
[gcode_macro _CLIENT_VARIABLE]
variable_runout_sensor: ""

# Eddy tap temperature. SimpleAF taps at 150 C with the heaters off (Eddy noise), so the nozzle
# cools during the samples and a filament stub left at the tip is still hard enough to skew Z.
# The CFS unloads to the box at the end of every print, so the hotend is empty and 170 C softens
# the stub (the nozzle squashes it) without oozing a blob. No nozzle wipe: the stock cleaning
# station hits the side-mounted Eddy. Also the nozzle preheat while the bed heats.
[gcode_macro _START_END_PARAMS]
variable_start_preheat_nozzle_temp: 170

# SimpleAF's side fan, off during a colour change so the part does not cool.
[gcode_macro _CFS_SETTINGS]
variable_aux_fan: "auxiliary"

# ---------------------------------------------------------------------------
# SimpleAF hooks: map and engage the feeder at the start (a missing filament fails before the
# heat soak), load the first tool before the line purge, return the filament to the box at
# the end (stock BOX_END behaviour). Slicer start G-code must pass INITIAL_TOOL, e.g.
#   START_PRINT EXTRUDER_TEMP=... BED_TEMP=... INITIAL_TOOL=[initial_no_support_extruder]
# ---------------------------------------------------------------------------
# CFS_PRINT_START does all of this at one point; SimpleAF splits it over two hooks.
[gcode_macro _SAF_START_PRINT_START]
gcode:
  _CHAMBER_START {rawparams}
  CFS_AUTO_MAP
  SET_FILAMENT_SENSOR SENSOR=filament_sensor_2 ENABLE=1
  CFS_FEEDER ENABLE=1

[gcode_macro _SAF_START_PRINT_BEFORE_LINE_PURGE]
gcode:
  SET_FAN_SPEED FAN=auxiliary SPEED=0
  {% if params.INITIAL_TOOL is defined and params.INITIAL_TOOL|string != "" %}
    CFS_TOOL TOOL={printer.AFC.tool_map["T%d" % (params.INITIAL_TOOL|int)]} TEMP={params.EXTRUDER_TEMP|default(printer.extruder.target)|float}
  {% elif not printer["filament_switch_sensor filament_sensor_2"].filament_detected %}
    RESPOND TYPE=error MSG="CFS: no INITIAL_TOOL in START_PRINT and the toolhead is empty; the line purge will be dry"
  {% endif %}

# The adaptive mesh only covers the objects the slicer declares; declare the prime tower too
# (CFS_TOWER_AREA reads it from the file's first layer) so it is not printed on the mesh's
# extrapolated edge.
[gcode_macro _SAF_START_PRINT_BEFORE_BED_MESH]
gcode:
  CFS_TOWER_AREA
  _CHAMBER_WAIT

# SimpleAF's CANCEL_PRINT runs _SAF_ON_CANCEL before CANCEL_PRINT_BASE and after
# TURN_OFF_HEATERS; CFS_PRINT_CANCEL turns the nozzle off again after the unload reheats it.
[gcode_macro _SAF_END_PRINT_START]
gcode:
  CFS_PRINT_END
  _CHAMBER_END

[gcode_macro _SAF_ON_CANCEL]
gcode:
  CFS_PRINT_CANCEL
  _CHAMBER_END

# SimpleAF has already paused the print (see CFS_ON_RUNOUT in cfs_k1max.cfg for the rest).
[gcode_macro _SAF_ON_FILAMENT_RUNOUT]
gcode:
  _CFS_ON_RUNOUT_RUN

[gcode_macro _SAF_ON_RESUME]
gcode:
  CFS_RESUME_CHECK

# ---------------------------------------------------------------------------
# Cancel during the print start: abortable_waits.py replaces M109/M190/TEMPERATURE_WAIT with
# versions that stop when a cancel is requested, so CANCEL_PRINT does not wait for the whole
# START_PRINT. SimpleAF's bed soak below uses ABORTABLE_WAIT instead of G4 for the same reason.
# ---------------------------------------------------------------------------
[abortable_waits]

[gcode_macro _WARP_STABILISE]
description: "Performs bed warp stabilisation based on the current bed temperature. Adjusts stabilisation time according to the bed temperature."
gcode:
    {% set multiplier = printer["gcode_macro _START_END_PARAMS"].bed_warp_wait_multiplier|float %}
    {% set interval = printer["gcode_macro _START_END_PARAMS"].bed_warp_wait_interval|int %}
    {% set partial = printer["gcode_macro _START_END_PARAMS"].bed_warp_fraction_wait|float %}

    {% set current_temp = params.CURRENT_TEMP|float %}
    {% set target_temp = params.TARGET_TEMP|float %}

    # if current temp is already pretty high, we only need to do a fraction of heat soaking
    {% if current_temp > (target_temp * partial) %}
        {% set total_time = ((target_temp - current_temp) * multiplier)|int %}
    {% else %}
        {% set total_time = (target_temp * multiplier)|int %}
    {% endif %}

    RESPOND TYPE=command MSG='Bed Warp Stabilisation starting with a total time of {total_time} seconds...'

    {% set loops = (total_time / interval)|int %}
    {% for i in range(loops) %}
        {% set time_remaining = total_time - (i + 1) * interval %}
        RESPOND TYPE=command MSG='Bed Warp Stabilization { time_remaining } seconds remaining'
        ABORTABLE_WAIT SECONDS={ time_remaining if time_remaining < interval else interval }
    {% endfor %}

    RESPOND TYPE=command MSG='Warp Stabilisation complete!'

# ---------------------------------------------------------------------------
# Chamber, Klipper/Marlin style: M141 S<t> sets the chamber target, M191 S<t> sets it and waits.
# The K1 Max has no chamber heater: the target is where the exhaust fan (temperature_fan
# chamber_fan) starts, the bed heats the chamber and the side fan stirs the air while it is colder.
# These replace SimpleAF's M141/M191 (fan_control.cfg is included before this file).
# START_PRINT takes the slicer's target and minimal chamber temperatures:
#   CHAMBER_TEMP= target (M141), CHAMBER_MIN= wait for at least this before the Eddy tap (M191).
# ---------------------------------------------------------------------------
[gcode_macro M141]
description: Set the chamber target (the exhaust fan runs above it). S0 = back to the default.
gcode:
  {% set s = params.S|default(0)|float %}
  {% set default = printer.configfile.settings["temperature_fan chamber_fan"].target_temp|float %}
  SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={s if s > 0 else default}

[gcode_macro M191]
description: Set the chamber target and wait for it (the bed heats the chamber).
gcode:
  {% set s = params.S|default(0)|float %}
  M141 S{s}
  {% if s > 0 %}
    {% if printer.heater_bed.target > 0 %}
      _CHAMBER_WAIT MINIMUM={s}
    {% else %}
      RESPOND MSG="M191: the bed is not heating yet; START_PRINT waits for {s|int}C once it is"
      SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=pending VALUE={s}
    {% endif %}
  {% endif %}

[gcode_macro _CHAMBER_WAIT]
variable_pending: 0
gcode:
  {% set minimum = params.MINIMUM|default(pending)|float %}
  {% set now = printer["temperature_sensor chamber_temp"].temperature %}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=pending VALUE=0
  {% if minimum > 0 and now < minimum %}
    RESPOND MSG="Waiting for the chamber: {now|round(1)}C -> {minimum|int}C"
    SET_FAN_SPEED FAN=auxiliary SPEED=0.5
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={minimum}
    RESPOND MSG="Chamber reached {minimum|int}C"
  {% endif %}

[gcode_macro _CHAMBER_START]
gcode:
  {% set target = params.CHAMBER_TEMP|default(0)|float %}
  {% set minimum = params.CHAMBER_MIN|default(0)|float %}
  {% if target > 0 %}
    M141 S{target}
    {% if printer["temperature_sensor chamber_temp"].temperature < target %}
      SET_FAN_SPEED FAN=auxiliary SPEED=0.5   # stirs the bed's heat; off before the line purge
    {% endif %}
  {% endif %}
  {% if minimum > 0 %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=pending VALUE={[minimum, printer["gcode_macro _CHAMBER_WAIT"].pending|float]|max}
  {% endif %}

[gcode_macro _CHAMBER_END]
gcode:
  SET_GCODE_VARIABLE MACRO=_CHAMBER_WAIT VARIABLE=pending VALUE=0
  M141 S0
